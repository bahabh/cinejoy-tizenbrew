```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cinejoy</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
        }

        #loading {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #000;
            color: #fff;

            font-family: Arial, sans-serif;
            font-size: 32px;

            z-index: 9999;
        }
    </style>
</head>

<body>

<div id="loading">
    Loading Cinejoy...
</div>

<script>
    /*
     * Cinejoy TizenBrew launcher
     *
     * TizenBrew loads this page locally and then
     * redirects the TV browser to Cinejoy.
     */

    const CINEJOY_URL = "https://cinejoy.to/";

    /*
     * Give the TV a moment to display the loading screen,
     * then navigate directly to Cinejoy.
     */
    setTimeout(function () {
        window.location.replace(CINEJOY_URL);
    }, 300);
</script>

</body>
</html>
```
